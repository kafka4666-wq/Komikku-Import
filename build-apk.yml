name: Build Komikku APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  JAVA_TOOL_OPTIONS: -Xmx4g
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out overlay repository
        uses: actions/checkout@v4
      - name: Check out official Komikku source
        uses: actions/checkout@v4
        with:
          repository: komikku-app/komikku
          path: upstream
      - name: Apply Kotlin overlay and package ID
        shell: bash
        run: |
          set -euo pipefail
          cp komikku-overlay.patch upstream/komikku-overlay.patch
          mkdir -p worker-overlay full-runtime-overlay
          unzip -q komikku-worker-instrumentation.zip -d worker-overlay
          unzip -q komikku-full-runtime-integrations.zip -d full-runtime-overlay
          cd upstream
          # The patch was generated with colored git diff output. Remove ANSI escapes
          # before applying it so file headers and Kotlin lines are valid patch text.
          for patch in komikku-overlay.patch; do
            perl -pe 's/\e\[[0-9;]*[[:alpha:]]//g' "$patch" > "$patch.clean"
            mv "$patch.clean" "$patch"
          done
          extract_new_file() {
            local path="$1"
            local header="diff --git a/${path} b/${path}"
            mkdir -p "$(dirname "$path")"
            awk -v header="$header" '
              $0 == header { found=1; next }
              found && /^diff --git / { exit }
              found && /^\+\+\+ b\// { next }
              found && /^\+/ { sub(/^\+/, ""); print }
            ' komikku-overlay.patch > "$path"
            test -s "$path"
          }
          git apply --recount --verbose komikku-overlay.patch
          test -s app/src/main/java/eu/kanade/tachiyomi/data/BannerProgressStatus.kt
          test -s app/src/main/java/eu/kanade/tachiyomi/data/notification/Notifications.kt
          # Copy new Kotlin files from the overlay repository itself. Keeping these
          # files outside the colored unified diff avoids any patch-parser ambiguity.
          mkdir -p app/src/main/java/exh/ui/batchadd app/src/main/java/exh/ui/nhentaidate
          cp ../app/src/main/java/exh/ui/batchadd/BatchImportJob.kt app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          cp ../worker-overlay/BatchImportJob.kt app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          cp ../app/src/main/java/exh/ui/nhentaidate/NhentaiDateImportScreen.kt app/src/main/java/exh/ui/nhentaidate/NhentaiDateImportScreen.kt
          cp ../app/src/main/java/exh/GalleryAdder.kt app/src/main/java/exh/GalleryAdder.kt
          # Crash-safe logging and sync error handling are copied after the base patch
          # so they cover both importer and unrelated application failures.
          mkdir -p app/src/main/java/exh/log app/src/main/java/eu/kanade/tachiyomi/crash app/src/main/java/eu/kanade/tachiyomi/util app/src/main/java/eu/kanade/tachiyomi/data/sync
          mkdir -p app/src/main/java/eu/kanade/domain/ui app/src/main/java/eu/kanade/presentation/more/settings/screen app/src/main/java/eu/kanade/presentation/library/components app/src/main/java/eu/kanade/presentation/more app/src/main/java/eu/kanade/tachiyomi/ui/more app/src/main/java/eu/kanade/tachiyomi/ui/main
          cp ../app/src/main/java/eu/kanade/domain/ui/KomikkuCustomisationPreferences.kt app/src/main/java/eu/kanade/domain/ui/KomikkuCustomisationPreferences.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/KomikkuFeatureStore.kt app/src/main/java/eu/kanade/domain/ui/KomikkuFeatureStore.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/KomikkuExtendedFeatureStore.kt app/src/main/java/eu/kanade/domain/ui/KomikkuExtendedFeatureStore.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/KomikkuRuntimeFeatureEngine.kt app/src/main/java/eu/kanade/domain/ui/KomikkuRuntimeFeatureEngine.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/KomikkuFullFeatureEngine.kt app/src/main/java/eu/kanade/domain/ui/KomikkuFullFeatureEngine.kt
          cp ../app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsKomikkuCustomisationScreen.kt app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsKomikkuCustomisationScreen.kt
          cp ../app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsMainScreen.kt app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsMainScreen.kt
          cp ../app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsSearchScreen.kt app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsSearchScreen.kt
          cp ../app/src/main/java/eu/kanade/presentation/library/components/LibraryToolbar.kt app/src/main/java/eu/kanade/presentation/library/components/LibraryToolbar.kt
          cp ../app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt
          cp ../app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt
          cp ../i18n-kmk/src/commonMain/moko-resources/base/strings.xml i18n-kmk/src/commonMain/moko-resources/base/strings.xml
          cp ../app/src/main/java/exh/log/EnhancedFilePrinter.kt app/src/main/java/exh/log/EnhancedFilePrinter.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/crash/GlobalExceptionHandler.kt app/src/main/java/eu/kanade/tachiyomi/crash/GlobalExceptionHandler.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/util/CrashLogUtil.kt app/src/main/java/eu/kanade/tachiyomi/util/CrashLogUtil.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/App.kt app/src/main/java/eu/kanade/tachiyomi/App.kt
          mkdir -p app/src/main/java/eu/kanade/tachiyomi/data/cache
          cp ../app/src/main/java/eu/kanade/tachiyomi/data/cache/CoverCache.kt app/src/main/java/eu/kanade/tachiyomi/data/cache/CoverCache.kt
          mkdir -p app/src/main/java/eu/kanade/tachiyomi/data/backup/create app/src/main/java/eu/kanade/tachiyomi/data/sync
          cp ../app/src/main/java/eu/kanade/tachiyomi/data/backup/create/BackupCreator.kt app/src/main/java/eu/kanade/tachiyomi/data/backup/create/BackupCreator.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/data/sync/SyncManager.kt app/src/main/java/eu/kanade/tachiyomi/data/sync/SyncManager.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/data/sync/SyncDataJob.kt app/src/main/java/eu/kanade/tachiyomi/data/sync/SyncDataJob.kt
          mkdir -p app/src/main/java/eu/kanade/tachiyomi/data/notification app/src/main/java/eu/kanade/tachiyomi/ui/download app/src/main/java/eu/kanade/tachiyomi/ui/reader
          cp ../app/src/main/java/eu/kanade/tachiyomi/data/notification/Notifications.kt app/src/main/java/eu/kanade/tachiyomi/data/notification/Notifications.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/download/DownloadQueueScreenModel.kt app/src/main/java/eu/kanade/tachiyomi/ui/download/DownloadQueueScreenModel.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          cp ../full-runtime-overlay/app/src/main/java/eu/kanade/tachiyomi/data/notification/Notifications.kt app/src/main/java/eu/kanade/tachiyomi/data/notification/Notifications.kt
          cp ../full-runtime-overlay/app/src/main/java/eu/kanade/tachiyomi/ui/download/DownloadQueueScreenModel.kt app/src/main/java/eu/kanade/tachiyomi/ui/download/DownloadQueueScreenModel.kt
          cp ../full-runtime-overlay/app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          grep -q '^package exh.ui.nhentaidate$' app/src/main/java/exh/ui/nhentaidate/NhentaiDateImportScreen.kt
          grep -q 'prefer the visible all-language Nhentai delegate first' app/src/main/java/exh/GalleryAdder.kt
          grep -q '^class NhentaiDailyReminderWorker' app/src/main/java/exh/ui/nhentaidate/NhentaiDateImportScreen.kt
          grep -q 'LOG_QUEUE_CAPACITY' app/src/main/java/exh/log/EnhancedFilePrinter.kt
          grep -q 'formatThrowable' app/src/main/java/eu/kanade/tachiyomi/crash/GlobalExceptionHandler.kt
          grep -q 'Sync stopped because the device ran out of memory' app/src/main/java/eu/kanade/tachiyomi/data/sync/SyncDataJob.kt
          grep -q 'maxSizePercent(context, 0.08)' app/src/main/java/eu/kanade/tachiyomi/App.kt
          grep -q 'startSyncIfNotRecentlyAttempted' app/src/main/java/eu/kanade/tachiyomi/App.kt
          grep -q 'CHANNEL_KOMIKKU_IMPORT' app/src/main/java/eu/kanade/tachiyomi/data/notification/Notifications.kt
          grep -q 'reorderByPriority' app/src/main/java/eu/kanade/tachiyomi/ui/download/DownloadQueueScreenModel.kt
          grep -q 'applyRuntimeReaderProfile' app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          grep -q 'class KomikkuCustomisationPreferences' app/src/main/java/eu/kanade/domain/ui/KomikkuCustomisationPreferences.kt
          grep -q 'screen = SettingsKomikkuCustomisationScreen' app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsMainScreen.kt
          grep -q 'SettingsKomikkuCustomisationScreen' app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsSearchScreen.kt
          grep -q 'object SettingsKomikkuCustomisationScreen' app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsKomikkuCustomisationScreen.kt
          grep -q 'collapseToolbar' app/src/main/java/eu/kanade/presentation/library/components/LibraryToolbar.kt
          grep -q 'showCustomDashboard' app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt
          grep -q 'onClickLibrary' app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          grep -q 'Komikku Action Center' app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt
          grep -q 'KomikkuFeatureStore' app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          grep -q 'KomikkuFeatureStore.extractLinks' app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt
          grep -q 'object KomikkuExtendedFeatureStore' app/src/main/java/eu/kanade/domain/ui/KomikkuExtendedFeatureStore.kt
          grep -q 'KomikkuExtendedFeatureStore' app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          grep -q 'KomikkuRuntimeFeatureEngine' app/src/main/java/eu/kanade/domain/ui/KomikkuRuntimeFeatureEngine.kt
          grep -q 'prioritizeLastQueued' app/src/main/java/eu/kanade/domain/ui/KomikkuRuntimeFeatureEngine.kt
          grep -q 'featureCatalog' app/src/main/java/eu/kanade/domain/ui/KomikkuFullFeatureEngine.kt
          grep -q 'duplicateFingerprint' app/src/main/java/eu/kanade/domain/ui/KomikkuFullFeatureEngine.kt
          grep -q 'adaptiveLayout' app/src/main/java/eu/kanade/domain/ui/KomikkuFullFeatureEngine.kt
          grep -q 'pref_category_komikku_customisation' i18n-kmk/src/commonMain/moko-resources/base/strings.xml
          grep -q 'ArrayList<Manga>' app/src/main/java/eu/kanade/tachiyomi/data/backup/create/BackupCreator.kt
          grep -q 'hasLocalManga' app/src/main/java/eu/kanade/tachiyomi/data/sync/SyncManager.kt
          test -s app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          grep -q 'recordSourceEvent' app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          grep -q 'batch_import_retry' app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          sed -i 's/applicationId = "app.komikku"/applicationId = "com.manus.komikku"/' app/build.gradle.kts
          # Force the generated APK to the stable-signed baseline identity.
          sed -i -E 's/^[[:space:]]*versionCode[[:space:]]*=.*/        versionCode = 86/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionName[[:space:]]*=.*/        versionName = "1.14.2"/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionNameSuffix[[:space:]]*=.*/            versionNameSuffix = ""/' app/build.gradle.kts
          grep -q 'versionCode = 86' app/build.gradle.kts
          grep -q 'versionName = "1.14.2' app/build.gradle.kts
          sed -i 's/applicationIdSuffix = "\.dev"/applicationIdSuffix = ""/' app/build.gradle.kts
          # Date discovery and library insertion run as foreground WorkManager tasks.
          perl -0pi -e 's#(<manifest[^>]*>\n)#$1    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n#' app/src/main/AndroidManifest.xml
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Configure stable signing
        working-directory: upstream
        env:
          KOMIKKU_KEYSTORE_BASE64: ${{ secrets.KOMIKKU_KEYSTORE_BASE64 }}
          KOMIKKU_KEYSTORE_PASSWORD: ${{ secrets.KOMIKKU_KEYSTORE_PASSWORD }}
          KOMIKKU_KEY_ALIAS: ${{ secrets.KOMIKKU_KEY_ALIAS }}
          KOMIKKU_KEY_PASSWORD: ${{ secrets.KOMIKKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KOMIKKU_KEYSTORE_BASE64"
          test -n "$KOMIKKU_KEYSTORE_PASSWORD"
          test -n "$KOMIKKU_KEY_ALIAS"
          test -n "$KOMIKKU_KEY_PASSWORD"
          printf '%s' "$KOMIKKU_KEYSTORE_BASE64" | base64 --decode > komikku-stable-release.jks
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          marker = "    buildTypes {\n"
          block = '''    signingConfigs {
              create("stableDebug") {
                  storeFile = rootProject.file("komikku-stable-release.jks")
                  storePassword = System.getenv("KOMIKKU_KEYSTORE_PASSWORD") ?: error("Missing stable keystore password")
                  keyAlias = System.getenv("KOMIKKU_KEY_ALIAS") ?: error("Missing stable key alias")
                  keyPassword = System.getenv("KOMIKKU_KEY_PASSWORD") ?: error("Missing stable key password")
              }
          }

          '''
          if marker not in text:
              raise SystemExit("Gradle buildTypes marker not found")
          text = text.replace(marker, block + marker, 1)
          debug_marker = "        val debug by getting {\n"
          debug_replacement = debug_marker + '            signingConfig = signingConfigs.getByName("stableDebug")\n'
          if debug_marker not in text:
              raise SystemExit("Gradle debug build type marker not found")
          text = text.replace(debug_marker, debug_replacement, 1)
          path.write_text(text)
          PY
          grep -q 'create("stableDebug")' app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("stableDebug")' app/build.gradle.kts
      - name: Make Gradle executable
        working-directory: upstream
        run: chmod +x ./gradlew
      - name: Build stable-signed debug APK
        working-directory: upstream
        env:
          KOMIKKU_KEYSTORE_PASSWORD: ${{ secrets.KOMIKKU_KEYSTORE_PASSWORD }}
          KOMIKKU_KEY_ALIAS: ${{ secrets.KOMIKKU_KEY_ALIAS }}
          KOMIKKU_KEY_PASSWORD: ${{ secrets.KOMIKKU_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Validate and locate universal APK
        working-directory: upstream
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*universal*debug.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$APK" | grep -Fx "com.manus.komikku"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/komikku-badging.txt
          grep -E "package: name='com.manus.komikku' versionCode='86' versionName='1.14.2'" /tmp/komikku-badging.txt
          sha256sum "$APK"
          echo "APK_PATH=upstream/$APK" >> "$GITHUB_ENV"
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-com.manus.komikku-stable-signed-universal-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komikku-build-reports
          path: upstream/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 30
