name: Build update-compatible Komikku APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  JAVA_TOOL_OPTIONS: -Xmx4g

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: komikku-app/komikku
          path: upstream
      - name: Apply patch and authoritative overlay
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          cp ../komikku-overlay.patch .
          perl -pe 's/\x1b\[[0-9;]*[[:alpha:]]//g' komikku-overlay.patch > p
          mv p komikku-overlay.patch
          git apply --recount --verbose komikku-overlay.patch
          unzip -oq ../komikku-final-overlay.zip -d .
          test -s app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          grep -Fq 'data class DuplicateReviewEntry' app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          grep -Fq 'Remove from library' app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          grep -Fq 'SettingsDoujinCustomisationsScreen' app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsMainScreen.kt
          grep -Fq 'System.currentTimeMillis()' app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          ! grep -R -Fq 'Duplicate review is non-destructive' app/src/main/java
          ! grep -R -Fq 'onOpenLibrary =' app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          sed -i 's/applicationId = "app.komikku"/applicationId = "com.manus.komikku"/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionCode[[:space:]]*=.*/        versionCode = 86/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionName[[:space:]]*=.*/        versionName = "1.14.2"/' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Configure stable signing
        working-directory: upstream
        env:
          KOMIKKU_KEYSTORE_BASE64: ${{ secrets.KOMIKKU_KEYSTORE_BASE64 }}
          KOMIKKU_KEYSTORE_PASSWORD: ${{ secrets.KOMIKKU_KEYSTORE_PASSWORD }}
          KOMIKKU_KEY_ALIAS: ${{ secrets.KOMIKKU_KEY_ALIAS }}
          KOMIKKU_KEY_PASSWORD: ${{ secrets.KOMIKKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KOMIKKU_KEYSTORE_BASE64"
          printf %s "$KOMIKKU_KEYSTORE_BASE64" | base64 -d > komikku-stable-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          t=p.read_text()
          m="    buildTypes {\n"
          b="""    signingConfigs {
        create("stableDebug") {
            storeFile = rootProject.file("komikku-stable-release.jks")
            storePassword = System.getenv("KOMIKKU_KEYSTORE_PASSWORD")
            keyAlias = System.getenv("KOMIKKU_KEY_ALIAS")
            keyPassword = System.getenv("KOMIKKU_KEY_PASSWORD")
        }
    }

"""
          t=t.replace(m,b+m,1)
          d="        val debug by getting {\n"
          t=t.replace(d,d+"            signingConfig = signingConfigs.getByName(\"stableDebug\")\n",1)
          p.write_text(t)
          PY
      - name: Build APK
        working-directory: upstream
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK
        working-directory: upstream
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump packagename "$APK" | grep -Fx com.manus.komikku
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='86'" /tmp/badging.txt
          grep -Fq "versionName='1.14.2'" /tmp/badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Komikku-com.manus.komikku-stable-signed
          path: upstream/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
