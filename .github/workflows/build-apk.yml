name: Build update-compatible Komikku APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/torrent-streaming]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  JAVA_TOOL_OPTIONS: -Xmx4g

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out overlay repository
        uses: actions/checkout@v4
      - name: Check out official Komikku source
        uses: actions/checkout@v4
        with:
          repository: komikku-app/komikku
          path: upstream
      - name: Apply base patch and final Kotlin overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-overlay
          unzip -q komikku-worker-instrumentation.zip -d worker-overlay
          cd upstream
          cp ../komikku-overlay.patch .
          perl -pe 's/\e\[[0-9;]*[[:alpha:]]//g' komikku-overlay.patch > komikku-overlay.patch.clean
          mv komikku-overlay.patch.clean komikku-overlay.patch
          git apply --recount --verbose komikku-overlay.patch
          # This is the sole authoritative late source copy. It contains the
          # complete compatible source family and therefore cannot be partially
          # overwritten by older runtime/feature archives.
          unzip -oq ../komikku-final-overlay.zip -d .
          # The worker copy remains available for the legacy importer path, but
          # the final archive wins if it contains the same source.
          if test -f ../worker-overlay/BatchImportJob.kt; then
            test -s app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          fi
          assert_source() {
            local label="$1"; local needle="$2"; local path="$3"
            test -s "$path" || { echo "missing $label: $path"; exit 1; }
            grep -Fq "$needle" "$path" || { echo "missing $label marker '$needle' in $path"; exit 1; }
          }
          assert_source "import job" "recordSourceEvent" app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          assert_source "daily import" "class NhentaiDailyReminderWorker" app/src/main/java/exh/ui/nhentaidate/NhentaiDateImportScreen.kt
          assert_source "Komikku preferences" "class KomikkuCustomisationPreferences" app/src/main/java/eu/kanade/domain/ui/KomikkuCustomisationPreferences.kt
          assert_source "Doujin settings" "screen = SettingsDoujinCustomisationsScreen" app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsMainScreen.kt
          assert_source "Doujin search" "SettingsDoujinCustomisationsScreen" app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsSearchScreen.kt
          assert_source "Doujin engine" "object DoujinFeatureEngine" app/src/main/java/eu/kanade/domain/ui/DoujinFeatureEngine.kt
          assert_source "Doujin tools" "class DoujinToolsScreen" app/src/main/java/eu/kanade/presentation/more/DoujinToolsScreens.kt
          assert_source "Doujin discovery" "class DoujinDiscoveryScreen" app/src/main/java/eu/kanade/presentation/more/DoujinToolsScreens.kt
          assert_source "duplicate review model" "data class DuplicateReviewEntry" app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          assert_source "bounded duplicate query" "getDuplicateLibraryEntries" app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          assert_source "complete duplicate scan" "Long.MAX_VALUE" app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          assert_source "duplicate cover thumbnails" "thumbnailUrl" app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          assert_source "direct Discover tab" "DiscoverTab" app/src/main/java/eu/kanade/tachiyomi/ui/home/HomeScreen.kt
          assert_source "Discover extension aggregation" "getVisibleOnlineSources" app/src/main/java/eu/kanade/tachiyomi/ui/discover/DiscoverTab.kt
          assert_source "Discover select all" "Select all" app/src/main/java/eu/kanade/tachiyomi/ui/discover/DiscoverTab.kt
          assert_source "safe removal label" "Remove from library" app/src/main/java/eu/kanade/presentation/more/KomikkuFeatureHubScreen.kt
          assert_source "More navigation" "onClickFeatureHub" app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          assert_source "reader timestamp" "System.currentTimeMillis()" app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          assert_source "import channel" "CHANNEL_KOMIKKU_IMPORT" app/src/main/java/eu/kanade/tachiyomi/data/notification/Notifications.kt
          assert_source "library safeguards" "visibleSections" app/src/main/java/eu/kanade/presentation/library/components/LibraryPager.kt
          ! grep -R -Fq "Duplicate review is non-destructive" app/src/main/java || { echo "stale duplicate-review stub detected"; exit 1; }
          ! grep -R -Fq "onOpenLibrary =" app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt || { echo "stale MoreTab callback detected"; exit 1; }
          chmod +x scripts/verify-torrent-streaming.sh
          scripts/verify-torrent-streaming.sh
          sed -i 's/applicationId = "app.komikku"/applicationId = "com.manus.komikku"/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionCode[[:space:]]*=.*/        versionCode = 86/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionName[[:space:]]*=.*/        versionName = "1.14.2"/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionNameSuffix[[:space:]]*=.*/            versionNameSuffix = ""/' app/build.gradle.kts
          # Upstream debug builds append .dev and the commit count. Clear both so
          # this update-compatible APK has the exact installed-app identity.
          sed -i '/val debug by getting {/,/isPseudoLocalesEnabled/ s/^[[:space:]]*applicationIdSuffix[[:space:]]*=.*$/            applicationIdSuffix = ""/' app/build.gradle.kts
          sed -i '/val debug by getting {/,/isPseudoLocalesEnabled/ s/^[[:space:]]*versionNameSuffix[[:space:]]*=.*$/            versionNameSuffix = ""/' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ""' app/build.gradle.kts
          grep -q 'versionNameSuffix = ""' app/build.gradle.kts
          grep -q 'versionCode = 86' app/build.gradle.kts
          grep -q 'versionName = "1.14.2' app/build.gradle.kts
          perl -0pi -e 's#(<manifest[^>]*>\n)#$1    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n#' app/src/main/AndroidManifest.xml
          perl -0pi -e 's#(<activity\n\s+android:name="\.ui\.main\.MainActivity"[^>]*?)>#${1}\n            android:alwaysRetainTaskState="true">#s' app/src/main/AndroidManifest.xml
          perl -0pi -e 's#(<activity\n\s+android:name="\.ui\.main\.MainActivity"[\s\S]*?android:launchMode=")singleTop#${1}singleTask#' app/src/main/AndroidManifest.xml
          grep -q 'android:alwaysRetainTaskState="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTask"' app/src/main/AndroidManifest.xml
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Configure stable signing
        working-directory: upstream
        env:
          KOMIKKU_KEYSTORE_BASE64: ${{ secrets.KOMIKKU_KEYSTORE_BASE64 }}
          KOMIKKU_KEYSTORE_PASSWORD: ${{ secrets.KOMIKKU_KEYSTORE_PASSWORD }}
          KOMIKKU_KEY_ALIAS: ${{ secrets.KOMIKKU_KEY_ALIAS }}
          KOMIKKU_KEY_PASSWORD: ${{ secrets.KOMIKKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KOMIKKU_KEYSTORE_BASE64"
          test -n "$KOMIKKU_KEYSTORE_PASSWORD"
          test -n "$KOMIKKU_KEY_ALIAS"
          test -n "$KOMIKKU_KEY_PASSWORD"
          printf '%s' "$KOMIKKU_KEYSTORE_BASE64" | base64 --decode > komikku-stable-release.jks
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          marker = "    buildTypes {\n"
          block = '''    signingConfigs {
              create("stableDebug") {
                  storeFile = rootProject.file("komikku-stable-release.jks")
                  storePassword = System.getenv("KOMIKKU_KEYSTORE_PASSWORD") ?: error("Missing stable keystore password")
                  keyAlias = System.getenv("KOMIKKU_KEY_ALIAS") ?: error("Missing stable key alias")
                  keyPassword = System.getenv("KOMIKKU_KEY_PASSWORD") ?: error("Missing stable key password")
              }
          }

          '''
          if marker not in text:
              raise SystemExit("Gradle buildTypes marker not found")
          text = text.replace(marker, block + marker, 1)
          debug_marker = "        val debug by getting {\n"
          replacement = debug_marker + '            signingConfig = signingConfigs.getByName("stableDebug")\n'
          if debug_marker not in text:
              raise SystemExit("Gradle debug build type marker not found")
          text = text.replace(debug_marker, replacement, 1)
          path.write_text(text)
          PY
      - name: Make Gradle executable
        working-directory: upstream
        run: chmod +x ./gradlew
      - name: Build stable-signed debug APK
        working-directory: upstream
        env:
          KOMIKKU_KEYSTORE_PASSWORD: ${{ secrets.KOMIKKU_KEYSTORE_PASSWORD }}
          KOMIKKU_KEY_ALIAS: ${{ secrets.KOMIKKU_KEY_ALIAS }}
          KOMIKKU_KEY_PASSWORD: ${{ secrets.KOMIKKU_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Validate and locate universal APK
        working-directory: upstream
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*universal*debug.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$APK" | grep -Fx "com.manus.komikku"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/komikku-badging.txt
          grep -E "package: name='com.manus.komikku' versionCode='86' versionName='1.14.2'" /tmp/komikku-badging.txt
          sha256sum "$APK"
          echo "APK_PATH=upstream/$APK" >> "$GITHUB_ENV"
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-com.manus.komikku-stable-signed-universal-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: komikku-build-reports
          path: upstream/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 30
