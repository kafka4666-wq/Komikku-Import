name: Build Komikku APK



on:

  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    


permissions:

  contents: read
  


env:

  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  
  JAVA_TOOL_OPTIONS: -Xmx4g
  


jobs:

  build-apk:
  
    runs-on: ubuntu-24.04
    
    timeout-minutes: 45
    
    steps:
    
      - name: Check out source
      
        uses: actions/checkout@v4
        


      - name: Check out official Komikku source
      
        uses: actions/checkout@v4
        
        with:
        
          repository: komikku-app/komikku
          
          path: upstream
          


      - name: Apply Kotlin source overlay
      
        run: |
        
          cp komikku-overlay.patch upstream/komikku-overlay.patch
          
          cd upstream
          
          git apply --verbose komikku-overlay.patch
          


      - name: Set up Java 21
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '21'
          
          cache: gradle
          


      - name: Set up Android SDK
      
        uses: android-actions/setup-android@v3
        


      - name: Install Android SDK packages
      
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
        


      - name: Make Gradle executable
      
        run: chmod +x ./upstream/gradlew
        


      - name: Build universal debug APK
      
        working-directory: upstream
        
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        


      - name: Validate APK metadata
      
        working-directory: upstream
        
        run: |
        
          APK=$(find app/build/outputs/apk/universal -type f -name '*.apk' | head -n 1)
          
          test -n "$APK"
          
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$APK" | grep -Fx 'com.manus.komikku'
          
          sha256sum "$APK"
          


      - name: Upload APK artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: Komikku-com.manus.komikku-debug
          
          path: upstream/app/build/outputs/apk/universal/*.apk
          
          if-no-files-found: error
          
          retention-days: 30
          


      - name: Upload build report
      
        if: always()
        
        uses: actions/upload-artifact@v4
        
        with:
        
          name: komikku-build-reports
          
          path: |
          
            upstream/app/build/reports/**
            
            upstream/app/build/test-results/**
            
          if-no-files-found: ignore
          
          retention-days: 30
          


      - name: Publish APK to workflow summary
      
        if: success()
        
        run: |
        
          APK=$(find upstream/app/build/outputs/apk/universal -type f -name '*.apk' | head -n 1)
          
          echo "## APK ready" >> "$GITHUB_STEP_SUMMARY"
          
          echo "Package: \\`com.manus.komikku\\`" >> "$GITHUB_STEP_SUMMARY"
          
          echo "SHA-256: \\`$(sha256sum "$APK" | cut -d ' ' -f 1)\\`" >> "$GITHUB_STEP_SUMMARY"
          
          echo "Download the \\`Komikku-com.manus.komikku-debug\\` artifact above." >> "$GITHUB_STEP_SUMMARY"
          






































































