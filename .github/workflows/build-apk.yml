name: Build update-compatible Komikku APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  JAVA_TOOL_OPTIONS: -Xmx4g

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out overlay repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out official Komikku source
        uses: actions/checkout@v4
        with:
          repository: komikku-app/komikku
          ref: 3402f2c7777f939fd05f9f66de86a8043bd95050
          path: upstream
      - name: Apply base patch and final Kotlin overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-overlay
          unzip -q komikku-worker-instrumentation.zip -d worker-overlay
          cd upstream
          cp ../komikku-overlay.patch .
          perl -pe 's/\e\[[0-9;]*[[:alpha:]]//g' komikku-overlay.patch > komikku-overlay.patch.clean
          mv komikku-overlay.patch.clean komikku-overlay.patch
          git apply --recount --verbose komikku-overlay.patch
          unzip -oq ../komikku-final-overlay.zip -d .
          mkdir -p app/src/main/java/exh/ui/reverse app/src/main/java/eu/kanade/tachiyomi/data/notification
          mkdir -p app/src/main/java/eu/kanade/tachiyomi/ui/library app/src/main/java/eu/kanade/tachiyomi/ui/reader
          mkdir -p app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader
          mkdir -p app/src/main/java/eu/kanade/presentation/reader
          mkdir -p app/src/test/java/exh/ui/batchadd
          mkdir -p app/src/main/java/eu/kanade/presentation/components
          cp ../app/src/main/java/exh/ui/reverse/ReverseSearchScreen.kt app/src/main/java/exh/ui/reverse/ReverseSearchScreen.kt
          cp ../app/src/main/java/exh/ui/reverse/ReverseSearchWorker.kt app/src/main/java/exh/ui/reverse/ReverseSearchWorker.kt
          # Restore last good BatchTitleSearch (strong/weak tabs + fast concurrency) then patch resume/found counts
          git -C "$GITHUB_WORKSPACE" show 253ca2b00bd5f87908f931fcbb5150bbc9340c83:app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt \
            > app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt')
          t = p.read_text()
          # Live found counts in UI
          t = t.replace(
              'if (total > 0) LinearProgressIndicator(progress = { completed.toFloat() / total }, modifier = Modifier.fillMaxWidth())\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {',
              'if (total > 0) LinearProgressIndicator(progress = { completed.toFloat() / total.coerceAtLeast(1) }, modifier = Modifier.fillMaxWidth())\n'
              '                        val found = progress?.getInt(BatchTitleSearchWorker.KEY_FOUND, 0) ?: 0\n'
              '                        val foundStrong = progress?.getInt(BatchTitleSearchWorker.KEY_FOUND_STRONG, 0) ?: 0\n'
              '                        Text("Found so far: $found matches · Strong $foundStrong", style = MaterialTheme.typography.titleSmall)\n'
              '                        Text("Safe to leave the app — reopen the same title list to resume if it is killed.", style = MaterialTheme.typography.bodySmall)\n'
              '                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {',
              1,
          )
          # Content-key checkpoint dirs (survive work id changes)
          t = t.replace(
              'val resultDirectory = File(applicationContext.filesDir, "batch-title-search-${id}.result-rows")\n        val finalResultFile = File(applicationContext.filesDir, "batch-title-search-${id}.final-results")',
              'val contentKey = inputData.getString(KEY_CONTENT_KEY) ?: id.toString()\n'
              '        val resultDirectory = File(applicationContext.filesDir, "batch-title-search-$contentKey.result-rows")\n'
              '        val finalResultFile = File(applicationContext.filesDir, "batch-title-search-$contentKey.final-results")',
              1,
          )
          t = t.replace(
              'val completed = AtomicInteger(titles.indices.count { rowFile(it).isFile })\n        val limits = searchConcurrencyLimits()',
              'val completed = AtomicInteger(titles.indices.count { rowFile(it).isFile })\n'
              '        val foundTotal = AtomicInteger(0)\n'
              '        val foundStrong = AtomicInteger(0)\n'
              '        run {\n'
              '            val existing = resultDirectory.listFiles().orEmpty()\n'
              '                .filter { it.isFile && it.name.endsWith(".row") }\n'
              '                .flatMap { it.readLines() }\n'
              '                .mapNotNull(::decode)\n'
              '            val collapsed = TitleSearchCandidateDeduplicator.collapse(existing)\n'
              '            foundTotal.set(collapsed.size)\n'
              '            foundStrong.set(collapsed.count { TitleMatchQuality.isStrong(it) })\n'
              '        }\n'
              '        val limits = searchConcurrencyLimits()',
              1,
          )
          t = t.replace(
              'val done = completed.incrementAndGet()\n                        setProgress(workDataOf(KEY_COMPLETED to done, KEY_TOTAL to titles.size, KEY_PAUSED to isPaused(applicationContext)))\n                        updateNotification(done, titles.size, "Finished $done/${titles.size}: ${title.take(48)}")',
              'foundTotal.addAndGet(candidates.distinctBy { it.url }.size)\n'
              '                        foundStrong.addAndGet(candidates.count { TitleMatchQuality.isStrong(it) })\n'
              '                        val done = completed.incrementAndGet()\n'
              '                        setProgress(workDataOf(KEY_COMPLETED to done, KEY_TOTAL to titles.size, KEY_FOUND to foundTotal.get(), KEY_FOUND_STRONG to foundStrong.get(), KEY_PAUSED to isPaused(applicationContext)))\n'
              '                        updateNotification(done, titles.size, "Finished $done/${titles.size} · found ~${foundTotal.get()} · ${title.take(36)}")',
              1,
          )
          t = t.replace(
              'setProgress(workDataOf(KEY_COMPLETED to completed.get(), KEY_TOTAL to titles.size))\n        updateNotification(completed.get(), titles.size, "Searching ${sources.size} enabled sources · ${limits.globalSourceSearches} concurrent requests")',
              'setProgress(workDataOf(KEY_COMPLETED to completed.get(), KEY_TOTAL to titles.size, KEY_FOUND to foundTotal.get(), KEY_FOUND_STRONG to foundStrong.get()))\n'
              '        updateNotification(completed.get(), titles.size, "Searching ${sources.size} sources · found ${foundTotal.get()} · resume-safe")',
              1,
          )
          t = t.replace(
              'const val KEY_COMPLETED = "completed"\n        const val KEY_TOTAL = "total"\n        const val KEY_PAUSED = "paused"',
              'const val KEY_CONTENT_KEY = "content_key"\n        const val KEY_COMPLETED = "completed"\n        const val KEY_TOTAL = "total"\n        const val KEY_FOUND = "found"\n        const val KEY_FOUND_STRONG = "found_strong"\n        const val KEY_PAUSED = "paused"',
              1,
          )
          old_enq = '''        suspend fun enqueue(context: Context, uri: Uri): UUID = withContext(Dispatchers.IO) {
            val workManager = context.workManager
            val uniqueName = uniqueUriWorkName(uri)
            val activeWork = runCatching {
                workManager.getWorkInfosForUniqueWork(uniqueName).get().firstOrNull { !it.state.isFinished }
            }.getOrNull()
            if (activeWork != null) return@withContext activeWork.id

            setPaused(context, false)
            val request = OneTimeWorkRequestBuilder<BatchTitleSearchWorker>()
                .setInputData(workDataOf(KEY_URI to uri.toString()))
                .addTag("batch_title_search")
                .build()
            workManager.enqueueUniqueWork(uniqueName, ExistingWorkPolicy.KEEP, request).result.get()
            runCatching {
                workManager.getWorkInfosForUniqueWork(uniqueName).get().firstOrNull { !it.state.isFinished }?.id
            }.getOrNull() ?: request.id
        }'''
          new_enq = '''        suspend fun enqueue(context: Context, uri: Uri): UUID = withContext(Dispatchers.IO) {
            val workManager = context.workManager
            val titles = context.contentResolver.openInputStream(uri)?.bufferedReader()?.useLines { lines ->
                lines.map(::cleanTitle).map(String::trim).filter(String::isNotBlank).distinct().toList()
            }.orEmpty()
            val contentKey = contentFingerprint(titles.ifEmpty { listOf(uri.toString()) })
            val uniqueName = "batch_title_search_content_$contentKey"
            val titlesFile = File(context.filesDir, "batch-title-search-$contentKey.txt")
            titlesFile.writeText(titles.joinToString("\\n"))
            val infos = runCatching { workManager.getWorkInfosForUniqueWork(uniqueName).get() }.getOrDefault(emptyList())
            val activeWork = infos.firstOrNull { !it.state.isFinished }
            if (activeWork != null) return@withContext activeWork.id
            val finished = infos.firstOrNull { it.state == WorkInfo.State.SUCCEEDED }
            val finalFile = File(context.filesDir, "batch-title-search-$contentKey.final-results")
            if (finished != null && finalFile.isFile && finalFile.length() > 0L) return@withContext finished.id
            setPaused(context, false)
            val request = OneTimeWorkRequestBuilder<BatchTitleSearchWorker>()
                .setInputData(workDataOf(KEY_URI to uri.toString(), KEY_TITLES_FILE to titlesFile.absolutePath, KEY_CONTENT_KEY to contentKey))
                .addTag("batch_title_search")
                .build()
            workManager.enqueueUniqueWork(uniqueName, ExistingWorkPolicy.KEEP, request)
            runCatching {
                workManager.getWorkInfosForUniqueWork(uniqueName).get().firstOrNull { !it.state.isFinished }?.id
            }.getOrNull() ?: request.id
        }
        private fun contentFingerprint(titles: List<String>): String {
            val digest = MessageDigest.getInstance("SHA-256")
            titles.forEach { title ->
                digest.update(title.lowercase().toByteArray(Charsets.UTF_8))
                digest.update(0)
            }
            return digest.digest().joinToString("") { "%02x".format(it.toInt() and 0xff) }.take(24)
        }'''
          if old_enq not in t:
              raise SystemExit('enqueue block not found for patch')
          t = t.replace(old_enq, new_enq, 1)
          p.write_text(t)
          assert 'KEY_FOUND' in t and 'contentFingerprint' in t and 'Found so far' in t
          print('BatchTitleSearch patched for found counts + content-hash resume')
          PY
          cp ../app/src/test/java/exh/ui/batchadd/BatchTitleSearchCandidateDeduplicatorTest.kt app/src/test/java/exh/ui/batchadd/BatchTitleSearchCandidateDeduplicatorTest.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/data/notification/NotificationReceiver.kt app/src/main/java/eu/kanade/tachiyomi/data/notification/NotificationReceiver.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          cp ../app/src/main/java/exh/ui/batchadd/BatchImportJob.kt app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryScreenModel.kt app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryScreenModel.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryStateSnapshot.kt app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryStateSnapshot.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderPageMergeStore.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderPageMergeStore.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt
          cp ../app/src/main/java/eu/kanade/presentation/reader/ReaderPageActionsDialog.kt app/src/main/java/eu/kanade/presentation/reader/ReaderPageActionsDialog.kt
          cp ../app/src/main/java/eu/kanade/presentation/components/MangaAuroraDesignSystem.kt app/src/main/java/eu/kanade/presentation/components/MangaAuroraDesignSystem.kt
          cp ../app/src/main/java/eu/kanade/presentation/components/MangaTreasuryVisuals.kt app/src/main/java/eu/kanade/presentation/components/MangaTreasuryVisuals.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/MangaPortCoverage.kt app/src/main/java/eu/kanade/domain/ui/MangaPortCoverage.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/DoujinCustomisationsPreferences.kt app/src/main/java/eu/kanade/domain/ui/DoujinCustomisationsPreferences.kt
          cp ../app/src/main/java/eu/kanade/presentation/library/components/DoujinCardAppearance.kt app/src/main/java/eu/kanade/presentation/library/components/DoujinCardAppearance.kt
          cp ../app/src/main/java/eu/kanade/presentation/library/components/CommonMangaItem.kt app/src/main/java/eu/kanade/presentation/library/components/CommonMangaItem.kt
          cp ../app/src/main/java/eu/kanade/presentation/manga/components/MangaInfoHeader.kt app/src/main/java/eu/kanade/presentation/manga/components/MangaInfoHeader.kt
          cp ../app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDoujinCustomisationsScreen.kt app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDoujinCustomisationsScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          t = p.read_text()
          t2, n = re.subn(
              r'implementation\([^\n]*flexible[^\n]*\)',
              'implementation("eu.davidea:flexible-adapter:5.1.0")',
              t,
              flags=re.IGNORECASE,
          )
          p.write_text(t2)
          print(f'replaced flexible implementation lines: {n}')
          PY
          sed -i 's/applicationId = "app.komikku"/applicationId = "com.manus.komikku"/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionCode[[:space:]]*=.*/        versionCode = 128/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionName[[:space:]]*=.*/        versionName = "1.15.17"/' app/build.gradle.kts
          sed -i -E 's/^[[:space:]]*versionNameSuffix[[:space:]]*=.*/            versionNameSuffix = ""/' app/build.gradle.kts
          sed -i '/val debug by getting {/,/isPseudoLocalesEnabled/ s/^[[:space:]]*applicationIdSuffix[[:space:]]*=.*$/            applicationIdSuffix = ""/' app/build.gradle.kts
          grep -q 'applicationId = "com.manus.komikku"' app/build.gradle.kts
          grep -Fq 'TitleMatchQuality.isStrong' app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          grep -Fq 'NORMAL_GLOBAL_SOURCE_SEARCHES = 64' app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          grep -Fq 'KEY_FOUND' app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          grep -Fq 'contentFingerprint' app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          grep -Fq 'Found so far' app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Configure stable signing
        working-directory: upstream
        env:
          KOMIKKU_KEYSTORE_BASE64: ${{ secrets.KOMIKKU_KEYSTORE_BASE64 }}
          KOMIKKU_KEYSTORE_PASSWORD: ${{ secrets.KOMIKKU_KEYSTORE_PASSWORD }}
          KOMIKKU_KEY_ALIAS: ${{ secrets.KOMIKKU_KEY_ALIAS }}
          KOMIKKU_KEY_PASSWORD: ${{ secrets.KOMIKKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KOMIKKU_KEYSTORE_BASE64"
          test -n "$KOMIKKU_KEYSTORE_PASSWORD"
          test -n "$KOMIKKU_KEY_ALIAS"
          test -n "$KOMIKKU_KEY_PASSWORD"
          printf '%s' "$KOMIKKU_KEYSTORE_BASE64" | base64 --decode > komikku-stable-release.jks
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          marker = "    buildTypes {\n"
          block = '''    signingConfigs {
              create("stableDebug") {
                  storeFile = rootProject.file("komikku-stable-release.jks")
                  storePassword = System.getenv("KOMIKKU_KEYSTORE_PASSWORD") ?: error("Missing stable keystore password")
                  keyAlias = System.getenv("KOMIKKU_KEY_ALIAS") ?: error("Missing stable key alias")
                  keyPassword = System.getenv("KOMIKKU_KEY_PASSWORD") ?: error("Missing stable key password")
              }
          }

          '''
          if marker not in text:
              raise SystemExit("Gradle buildTypes marker not found")
          text = text.replace(marker, block + marker, 1)
          debug_marker = "        val debug by getting {\n"
          replacement = debug_marker + '            signingConfig = signingConfigs.getByName("stableDebug")\n'
          if debug_marker not in text:
              raise SystemExit("Gradle debug build type marker not found")
          text = text.replace(debug_marker, replacement, 1)
          path.write_text(text)
          PY
      - name: Build stable-signed debug APK
        working-directory: upstream
        env:
          KOMIKKU_KEYSTORE_PASSWORD: ${{ secrets.KOMIKKU_KEYSTORE_PASSWORD }}
          KOMIKKU_KEY_ALIAS: ${{ secrets.KOMIKKU_KEY_ALIAS }}
          KOMIKKU_KEY_PASSWORD: ${{ secrets.KOMIKKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Validate and locate universal APK
        working-directory: upstream
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*universal*debug.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$APK" | grep -Fx "com.manus.komikku"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/komikku-badging.txt
          grep -E "package: name='com.manus.komikku' versionCode='128'" /tmp/komikku-badging.txt
          sha256sum "$APK"
          echo "APK_PATH=upstream/$APK" >> "$GITHUB_ENV"
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-com.manus.komikku-v1.15.17-stable-signed-universal-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
