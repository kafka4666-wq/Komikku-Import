name: Build update-compatible Komikku APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
  JAVA_TOOL_OPTIONS: -Xmx4g

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out overlay repository
        uses: actions/checkout@v4
      - name: Check out official Komikku source
        uses: actions/checkout@v4
        with:
          repository: komikku-app/komikku
          ref: 3402f2c7777f939fd05f9f66de86a8043bd95050
          path: upstream
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Apply base patch and final Kotlin overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p worker-overlay
          unzip -q komikku-worker-instrumentation.zip -d worker-overlay
          cd upstream
          cp ../komikku-overlay.patch .
          perl -pe 's/\e\[[0-9;]*[[:alpha:]]//g' komikku-overlay.patch > komikku-overlay.patch.clean
          mv komikku-overlay.patch.clean komikku-overlay.patch
          git apply --recount --verbose komikku-overlay.patch
          unzip -oq ../komikku-final-overlay.zip -d .
          mkdir -p app/src/main/java/exh/ui/reverse app/src/main/java/eu/kanade/tachiyomi/data/notification
          mkdir -p app/src/main/java/eu/kanade/tachiyomi/ui/library app/src/main/java/eu/kanade/tachiyomi/ui/reader
          mkdir -p app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader
          mkdir -p app/src/main/java/eu/kanade/presentation/reader
          mkdir -p app/src/test/java/exh/ui/batchadd
          cp ../app/src/main/java/exh/ui/reverse/ReverseSearchScreen.kt app/src/main/java/exh/ui/reverse/ReverseSearchScreen.kt
          cp ../app/src/main/java/exh/ui/reverse/ReverseSearchWorker.kt app/src/main/java/exh/ui/reverse/ReverseSearchWorker.kt
          cp ../app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          cp ../app/src/test/java/exh/ui/batchadd/BatchTitleSearchCandidateDeduplicatorTest.kt app/src/test/java/exh/ui/batchadd/BatchTitleSearchCandidateDeduplicatorTest.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/data/notification/NotificationReceiver.kt app/src/main/java/eu/kanade/tachiyomi/data/notification/NotificationReceiver.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt
          cp ../app/src/main/java/exh/ui/batchadd/BatchImportJob.kt app/src/main/java/exh/ui/batchadd/BatchImportJob.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryScreenModel.kt app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryScreenModel.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryStateSnapshot.kt app/src/main/java/eu/kanade/tachiyomi/ui/library/LibraryStateSnapshot.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderPageMergeStore.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderPageMergeStore.kt
          cp ../app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt app/src/main/java/eu/kanade/tachiyomi/ui/reader/loader/HttpPageLoader.kt
          cp ../app/src/main/java/eu/kanade/presentation/reader/ReaderPageActionsDialog.kt app/src/main/java/eu/kanade/presentation/reader/ReaderPageActionsDialog.kt
          mkdir -p app/src/main/java/eu/kanade/presentation/components
          cp ../app/src/main/java/eu/kanade/presentation/components/MangaAuroraDesignSystem.kt app/src/main/java/eu/kanade/presentation/components/MangaAuroraDesignSystem.kt
          cp ../app/src/main/java/eu/kanade/presentation/components/MangaTreasuryVisuals.kt app/src/main/java/eu/kanade/presentation/components/MangaTreasuryVisuals.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/MangaPortCoverage.kt app/src/main/java/eu/kanade/domain/ui/MangaPortCoverage.kt
          cp ../app/src/main/java/eu/kanade/domain/ui/DoujinCustomisationsPreferences.kt app/src/main/java/eu/kanade/domain/ui/DoujinCustomisationsPreferences.kt
          cp ../app/src/main/java/eu/kanade/presentation/library/components/DoujinCardAppearance.kt app/src/main/java/eu/kanade/presentation/library/components/DoujinCardAppearance.kt
          cp ../app/src/main/java/eu/kanade/presentation/library/components/CommonMangaItem.kt app/src/main/java/eu/kanade/presentation/library/components/CommonMangaItem.kt
          cp ../app/src/main/java/eu/kanade/presentation/manga/components/MangaInfoHeader.kt app/src/main/java/eu/kanade/presentation/manga/components/MangaInfoHeader.kt
          cp ../app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDoujinCustomisationsScreen.kt app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsDoujinCustomisationsScreen.kt
          if grep -Fq 'com.github.arkon.FlexibleAdapter:flexible-adapter:c8013533' gradle/libs.versions.toml; then
            sed -i 's#com.github.arkon.FlexibleAdapter:flexible-adapter:c8013533#eu.davidea:flexible-adapter:5.1.0#g' gradle/libs.versions.toml
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gradle/libs.versions.toml")
          text = path.read_text()
          text = text.replace(
              'flexibleAdapter = { module = "eu.davidea:flexible-adapter",',
              'flexible-adapter-core = { module = "eu.davidea:flexible-adapter",',
              1,
          )
          path.write_text(text)
          PY
          # Also fix build.gradle.kts if it still references libs.flexible
          if grep -q 'libs.flexible' app/build.gradle.kts 2>/dev/null; then
            sed -i 's/libs\.flexible\./libs.flexibleAdapter./g; s/libs\.flexible"/libs.flexibleAdapter"/g' app/build.gradle.kts || true
            sed -i 's/libs\.flexible\b/libs.flexibleAdapter/g' app/build.gradle.kts || true
          fi
          # Prefer mapping flexible -> flexible-adapter-core in version catalog usage
          if grep -q "libs.flexible[^.A-Za-z]" app/build.gradle.kts 2>/dev/null; then
            sed -i 's/libs\.flexible\([^A-Za-z.]\)/libs.flexibleAdapter\1/g' app/build.gradle.kts || true
          fi
          # Direct fix for unresolved 'flexible' at line ~286
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          t = p.read_text()
          t2 = t.replace('libs.flexible', 'libs.flexibleAdapter')
          if t2 != t:
              p.write_text(t2)
              print('rewrote libs.flexible -> libs.flexibleAdapter')
          else:
              print('no libs.flexible occurrences')
          PY
          assert_source() {
            local label="$1"; local needle="$2"; local path="$3"
            test -s "$path" || { echo "missing $label: $path"; exit 1; }
            grep -Fq "$needle" "$path" || { echo "missing $label marker '$needle' in $path"; exit 1; }
          }
          assert_source "title search strong quality" "TitleMatchQuality.isStrong" app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          assert_source "fast concurrency" "NORMAL_GLOBAL_SOURCE_SEARCHES = 64" app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
          assert_source "strong weak tabs" "Strong (" app/src/main/java/exh/ui/batchadd/BatchTitleSearch.kt
      - name: Build debug APK
        working-directory: upstream
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: komikku-import-apk
          path: |
            upstream/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
